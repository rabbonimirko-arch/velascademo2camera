<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>D-ID Agent Face Presence</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-text-size-adjust:100%;
    }

    .stage {
      width:100vw;
      height:100vh;
      display:grid;
      place-items:center;
      background:#000;
    }

    .frame {
      width:min(100vw, calc(100vh * 9 / 16));
      height:min(100vh, calc(100vw * 16 / 9));
      position:relative;
      overflow:hidden;
      background:#000;
    }

    #agent-container {
      width:100%;
      height:100%;
      background:#000;
      position:relative;
      z-index:1;
    }

    .overlay {
      position:absolute;
      inset:0;
      z-index:5;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      padding:24px;
      background:rgba(0,0,0,.82);
      font-size:18px;
      line-height:1.45;
      transition:opacity .35s ease;
    }

    .overlay.hidden {
      opacity:0;
      pointer-events:none;
    }

    .status {
      position:absolute;
      left:12px;
      right:12px;
      bottom:12px;
      z-index:6;
      color:rgba(255,255,255,.95);
      font-size:13px;
      text-align:center;
      padding:10px 12px;
      border-radius:10px;
      background:rgba(0,0,0,.55);
      backdrop-filter:blur(4px);
    }

    .tapStart {
      position:absolute;
      inset:0;
      z-index:8;
      display:none;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      padding:24px;
      background:rgba(0,0,0,.86);
      font-size:22px;
      line-height:1.4;
      cursor:pointer;
    }

    .tapStart.show {
      display:flex;
    }

    .cameraBox {
      position:absolute;
      top:12px;
      left:12px;
      width:110px;
      height:146px;
      border-radius:12px;
      overflow:hidden;
      z-index:7;
      background:#111;
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 6px 18px rgba(0,0,0,.35);
    }

    .cameraBox.hidden {
      display:none;
    }

    #debugVideo {
      width:100%;
      height:100%;
      object-fit:cover;
      transform:scaleX(-1);
      display:block;
    }

    .cameraLabel {
      position:absolute;
      top:164px;
      left:12px;
      z-index:7;
      padding:5px 8px;
      border-radius:999px;
      background:rgba(0,0,0,.55);
      color:#fff;
      font-size:11px;
    }

    .cameraLabel.hidden {
      display:none;
    }

    video#presenceCam,
    canvas#presenceCanvas {
      position:fixed;
      left:-9999px;
      top:-9999px;
      width:1px;
      height:1px;
      opacity:0.001;
      pointer-events:none;
    }

    ::-webkit-scrollbar { width:0; height:0; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <div id="agent-container"></div>

      <div class="overlay" id="overlay">
        Avvicinati per iniziare<br>
        L’assistente AI si attiverà automaticamente
      </div>

      <div class="status" id="status">Avvio rilevamento presenza…</div>

      <div class="tapStart" id="tapStart">
        Tocca per avviare l’assistente
      </div>

      <div class="cameraBox" id="cameraBox">
        <video id="debugVideo" autoplay playsinline muted></video>
      </div>
      <div class="cameraLabel" id="cameraLabel">Camera attiva</div>
    </div>
  </div>

  <video id="presenceCam" autoplay playsinline muted></video>
  <canvas id="presenceCanvas" width="160" height="120"></canvas>

  <script>
    const overlay = document.getElementById('overlay');
    const statusBox = document.getElementById('status');
    const tapStart = document.getElementById('tapStart');
    const cam = document.getElementById('presenceCam');
    const debugVideo = document.getElementById('debugVideo');
    const cameraBox = document.getElementById('cameraBox');
    const cameraLabel = document.getElementById('cameraLabel');
    const canvas = document.getElementById('presenceCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let stream = null;
    let detected = false;
    let agentLoaded = false;
    let motionInterval = null;
    let faceInterval = null;
    let lastFrame = null;
    let motionHits = 0;
    let faceHits = 0;

    function setStatus(text) {
      statusBox.textContent = text;
      console.log(text);
    }

    function requestFs() {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (fn) {
        try { fn.call(el); } catch(e) {}
      }
    }

    function cleanupCamera() {
      if (motionInterval) {
        clearInterval(motionInterval);
        motionInterval = null;
      }
      if (faceInterval) {
        clearInterval(faceInterval);
        faceInterval = null;
      }
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      cam.srcObject = null;
      debugVideo.srcObject = null;
      cameraBox.classList.add('hidden');
      cameraLabel.classList.add('hidden');
    }

    async function startCamera() {
      try {
        setStatus('Richiesta accesso alla fotocamera…');

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 15, max: 20 }
          },
          audio: false
        });

        cam.srcObject = stream;
        debugVideo.srcObject = stream;

        await waitVideoReady(cam);
        await cam.play().catch(() => {});
        await debugVideo.play().catch(() => {});

        setStatus('Camera pronta. Ricerca volto…');

        if ('FaceDetector' in window) {
          startFaceDetection();
        } else {
          setStatus('Face detection non supportato. Uso rilevamento movimento avanzato…');
          startAggressiveMotionDetection();
        }

      } catch (err) {
        console.error(err);
        setStatus('Fotocamera non disponibile. Tocca per avviare.');
        tapStart.classList.add('show');
      }
    }

    function waitVideoReady(videoEl) {
      return new Promise((resolve) => {
        if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
          resolve();
          return;
        }
        const done = () => {
          if (videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
            videoEl.removeEventListener('loadedmetadata', done);
            videoEl.removeEventListener('canplay', done);
            resolve();
          }
        };
        videoEl.addEventListener('loadedmetadata', done);
        videoEl.addEventListener('canplay', done);
      });
    }

    function startFaceDetection() {
      let detector;
      try {
        detector = new FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
      } catch (e) {
        setStatus('Face detector non inizializzabile. Uso motion fallback…');
        startAggressiveMotionDetection();
        return;
      }

      faceHits = 0;

      faceInterval = setInterval(async () => {
        if (detected) return;
        if (!cam.videoWidth || cam.readyState < 2) return;

        try {
          const faces = await detector.detect(cam);

          if (faces && faces.length > 0) {
            faceHits++;
            setStatus('Volto rilevato…');
          } else {
            faceHits = Math.max(0, faceHits - 1);
            setStatus('Ricerca volto…');
          }

          if (faceHits >= 2) {
            onPresenceDetected();
          }
        } catch (err) {
          console.warn('Errore FaceDetector:', err);
          clearInterval(faceInterval);
          faceInterval = null;
          startAggressiveMotionDetection();
        }
      }, 500);
    }

    function startAggressiveMotionDetection() {
      lastFrame = null;
      motionHits = 0;

      motionInterval = setInterval(() => {
        if (detected) return;
        if (!cam.videoWidth || cam.readyState < 2) return;

        try {
          ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
          const frame = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

          if (lastFrame) {
            let changed = 0;
            let sum = 0;

            for (let i = 0; i < frame.length; i += 8) {
              const d = Math.abs(frame[i] - lastFrame[i]);
              sum += d;
              if (d > 12) changed++;
            }

            if (sum > 7000 && changed > 250) {
              motionHits++;
              setStatus('Presenza in rilevamento…');
            } else {
              motionHits = Math.max(0, motionHits - 1);
              setStatus('Attendo presenza…');
            }

            if (motionHits >= 2) {
              onPresenceDetected();
              return;
            }
          }

          lastFrame = new Uint8ClampedArray(frame);
        } catch (e) {
          console.warn('Errore motion detection:', e);
        }
      }, 250);
    }

    function loadDidAgent() {
      if (agentLoaded) return;
      agentLoaded = true;

      setStatus('Caricamento assistente…');

      const script = document.createElement('script');
      script.type = 'module';
      script.src = 'https://agent.d-id.com/v2/index.js';
      script.setAttribute('data-mode', 'full');
      script.setAttribute('data-client-key', 'Z29vZ2xlLW9hdXRoMnwxMTgyMzY0ODQ3MTYxODA2NDM0Mjk6SkNJemxyN2FsYmhFR1Q3WmxOMVRy');
      script.setAttribute('data-agent-id', 'v2_agt_TSs3J5qX');
      script.setAttribute('data-name', 'did-agent');
      script.setAttribute('data-monitor', 'false');
      script.setAttribute('data-target-id', 'agent-container');

      script.onload = () => {
        setStatus('Assistente pronto');
      };

      script.onerror = () => {
        setStatus('Errore caricamento D-ID');
        tapStart.classList.add('show');
      };

      document.body.appendChild(script);
    }

    function onPresenceDetected() {
      if (detected) return;
      detected = true;

      setStatus('Presenza rilevata');
      overlay.classList.add('hidden');

      cleanupCamera();

      setTimeout(() => {
        requestFs();
        loadDidAgent();
      }, 600);
    }

    tapStart.addEventListener('click', () => {
      overlay.classList.add('hidden');
      tapStart.classList.remove('show');
      cleanupCamera();
      requestFs();
      loadDidAgent();
    });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (event) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) event.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    startCamera();
  </script>
</body>
</html>
