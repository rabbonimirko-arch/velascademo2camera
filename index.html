<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>D-ID Agent Presence</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-text-size-adjust:100%;
    }

    .stage {
      width:100vw;
      height:100vh;
      display:grid;
      place-items:center;
      background:#000;
    }

    .frame {
      width:min(100vw, calc(100vh * 9 / 16));
      height:min(100vh, calc(100vw * 16 / 9));
      position:relative;
      overflow:hidden;
      background:#000;
    }

    #agent-container {
      width:100%;
      height:100%;
      position:relative;
      z-index:1;
      background:#000;
    }

    .overlay {
      position:absolute;
      inset:0;
      z-index:5;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      padding:24px;
      background:rgba(0,0,0,.82);
      font-size:18px;
      line-height:1.45;
      transition:opacity .35s ease;
    }

    .overlay.hidden {
      opacity:0;
      pointer-events:none;
    }

    .status {
      position:absolute;
      left:12px;
      right:12px;
      bottom:12px;
      z-index:6;
      color:rgba(255,255,255,.92);
      font-size:13px;
      text-align:center;
      padding:8px 10px;
      border-radius:10px;
      background:rgba(0,0,0,.45);
      backdrop-filter:blur(4px);
    }

    .tapStart {
      position:absolute;
      inset:0;
      z-index:7;
      display:none;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      padding:24px;
      background:rgba(0,0,0,.85);
      font-size:20px;
      line-height:1.4;
      cursor:pointer;
    }

    .tapStart.show {
      display:flex;
    }

    video#presenceCam,
    canvas#presenceCanvas {
      position:fixed;
      width:1px;
      height:1px;
      opacity:0.001;
      pointer-events:none;
      left:-9999px;
      top:-9999px;
    }

    ::-webkit-scrollbar { width:0; height:0; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <div id="agent-container"></div>

      <div class="overlay" id="overlay">
        Avvicinati per iniziare<br>
        L’assistente AI si attiverà automaticamente
      </div>

      <div class="status" id="status">Avvio rilevamento presenza…</div>

      <div class="tapStart" id="tapStart">
        Tocca per avviare l’assistente
      </div>
    </div>
  </div>

  <video id="presenceCam" autoplay playsinline muted></video>
  <canvas id="presenceCanvas" width="160" height="120"></canvas>

  <script>
    const overlay = document.getElementById('overlay');
    const statusBox = document.getElementById('status');
    const tapStart = document.getElementById('tapStart');
    const cam = document.getElementById('presenceCam');
    const canvas = document.getElementById('presenceCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let presenceStream = null;
    let detectionRunning = false;
    let detected = false;
    let agentLoaded = false;
    let lastFrame = null;
    let stableFrames = 0;

    function setStatus(text) {
      statusBox.textContent = text;
    }

    function requestFs() {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (fn) {
        try { fn.call(el); } catch(e) {}
      }
    }

    function stopPresenceCamera() {
      detectionRunning = false;
      if (presenceStream) {
        presenceStream.getTracks().forEach(track => track.stop());
        presenceStream = null;
      }
      cam.srcObject = null;
    }

    async function startPresenceCamera() {
      try {
        setStatus('Richiesta accesso alla fotocamera…');

        presenceStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 320 },
            height: { ideal: 240 },
            frameRate: { ideal: 10, max: 15 }
          },
          audio: false
        });

        cam.srcObject = presenceStream;

        await new Promise(resolve => {
          if (cam.readyState >= 2) return resolve();
          cam.onloadedmetadata = () => resolve();
        });

        await cam.play();

        detectionRunning = true;
        setStatus('Rilevamento presenza attivo');
        requestAnimationFrame(scanMotion);

      } catch (err) {
        console.error(err);
        setStatus('Fotocamera non disponibile. Tocca per avviare.');
        tapStart.classList.add('show');
      }
    }

    function scanMotion() {
      if (!detectionRunning || detected) return;

      if (cam.readyState < 2 || !cam.videoWidth || !cam.videoHeight) {
        requestAnimationFrame(scanMotion);
        return;
      }

      try {
        ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
      } catch (e) {
        requestAnimationFrame(scanMotion);
        return;
      }

      const frame = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

      if (lastFrame) {
        let diff = 0;

        for (let i = 0; i < frame.length; i += 16) {
          diff += Math.abs(frame[i] - lastFrame[i]);
        }

        if (diff > 9000) {
          stableFrames++;
        } else {
          stableFrames = 0;
        }

        if (stableFrames >= 3) {
          onPresenceDetected();
          return;
        }
      }

      lastFrame = new Uint8ClampedArray(frame);
      requestAnimationFrame(scanMotion);
    }

    function loadDidAgent() {
      if (agentLoaded) return;
      agentLoaded = true;

      setStatus('Caricamento assistente…');

      const script = document.createElement('script');
      script.type = 'module';
      script.src = 'https://agent.d-id.com/v2/index.js';
      script.setAttribute('data-mode', 'full');
      script.setAttribute('data-client-key', 'Z29vZ2xlLW9hdXRoMnwxMTgyMzY0ODQ3MTYxODA2NDM0Mjk6SkNJemxyN2FsYmhFR1Q3WmxOMVRy');
      script.setAttribute('data-agent-id', 'v2_agt_TSs3J5qX');
      script.setAttribute('data-name', 'did-agent');
      script.setAttribute('data-monitor', 'false');
      script.setAttribute('data-target-id', 'agent-container');

      script.onload = () => {
        setStatus('Assistente pronto');
      };

      script.onerror = () => {
        setStatus('Errore nel caricamento D-ID');
        tapStart.classList.add('show');
      };

      document.body.appendChild(script);

      setTimeout(() => {
        if (statusBox.textContent === 'Caricamento assistente…') {
          setStatus('L’assistente sta impiegando più tempo del previsto');
        }
      }, 12000);
    }

    function onPresenceDetected() {
      detected = true;
      setStatus('Presenza rilevata');
      overlay.classList.add('hidden');

      stopPresenceCamera();

      setTimeout(() => {
        requestFs();
        loadDidAgent();
      }, 700);
    }

    tapStart.addEventListener('click', () => {
      overlay.classList.add('hidden');
      requestFs();
      stopPresenceCamera();
      loadDidAgent();
      tapStart.classList.remove('show');
    });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (event) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) event.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    startPresenceCamera();
  </script>
</body>
</html>
