<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>D-ID Agent</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
      font-family:Arial, sans-serif;
    }

    .stage {
      width:100vw;
      height:100vh;
      display:grid;
      place-items:center;
      background:#000;
    }

    .frame {
      width:min(100vw, calc(100vh * 9 / 16));
      height:min(100vh, calc(100vw * 16 / 9));
      background:#000;
      position:relative;
      overflow:hidden;
    }

    #did-agent {
      width:100%;
      height:100%;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <div id="did-agent"></div>
    </div>
  </div>

  <script
    type="module"
    src="https://agent.d-id.com/v2/index.js"
    data-mode="full"
    data-client-key="INSERISCI_QUI_LA_TUA_NUOVA_CLIENT_KEY"
    data-agent-id="v2_agt_TSs3J5qX"
    data-name="did-agent"
    data-monitor="false"
    data-target-id="did-agent">
  </script>
</body>
</html>
