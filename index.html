<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Agent PRO</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:system-ui;
}

.stage {
  width:100vw;
  height:100vh;
  display:grid;
  place-items:center;
}

.frame {
  width:min(100vw, calc(100vh * 9 / 16));
  height:min(100vh, calc(100vw * 16 / 9));
  position:relative;
  background:#000;
}

/* container agent */
#agent-container {
  width:100%;
  height:100%;
}

/* overlay presenza */
.overlay {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  background:rgba(0,0,0,0.7);
  text-align:center;
  z-index:10;
  font-size:18px;
  padding:20px;
  transition:opacity .4s;
}

.hidden {
  opacity:0;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="stage">
  <div class="frame">

    <div id="agent-container"></div>

    <div class="overlay" id="overlay">
      Avvicinati per iniziare<br>
      L’assistente AI si attiverà automaticamente
    </div>

  </div>
</div>

<!-- 🎥 video invisibile -->
<video id="cam" autoplay playsinline muted style="display:none"></video>

<!-- ✅ D-ID SDK -->
<script type="module"
  src="https://agent.d-id.com/v2/index.js"
  data-mode="full"
  data-client-key="Z29vZ2xlLW9hdXRoMnwxMTgyMzY0ODQ3MTYxODA2NDM0Mjk6SkNJemxyN2FsYmhFR1Q3WmxOMVRy"
  data-agent-id="v2_agt_TSs3J5qX"
  data-name="did-agent"
  data-monitor="true"
  data-target-id="agent-container">
</script>

<script>
// ==========================
// 🎥 PRESENCE DETECTION
// ==========================
const cam = document.getElementById("cam");
const overlay = document.getElementById("overlay");

let detected = false;

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  cam.srcObject = stream;
  detectMotion();
})
.catch(() => {
  console.log("camera non disponibile");
});

function detectMotion() {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = 160;
  canvas.height = 120;

  let last = null;

  function scan() {
    ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
    let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);

    if (last && !detected) {
      let diff = 0;

      for (let i = 0; i < frame.data.length; i += 4) {
        diff += Math.abs(frame.data[i] - last.data[i]);
      }

      if (diff > 50000) {
        detected = true;
        startAgent();
      }
    }

    last = frame;
    requestAnimationFrame(scan);
  }

  scan();
}

// ==========================
// 🚀 START AGENT
// ==========================
function startAgent() {

  console.log("utente rilevato");

  overlay.classList.add("hidden");

  // simula click per sbloccare audio/video
  document.body.click();

  // fullscreen
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen();
}

// ==========================
// 🔒 BLOCCA ZOOM
// ==========================
let lastTouchEnd = 0;
document.addEventListener('touchend', (event) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) event.preventDefault();
  lastTouchEnd = now;
}, { passive:false });

</script>

</body>
</html>
