<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>D-ID Auto Presence Stable</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .stage {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
    }

    .frame {
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      position: relative;
      overflow: hidden;
      background: #000;
    }

    #agent-root {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 1;
    }

    #agent-container {
      width: 100%;
      height: 100%;
      background: #000;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      padding: 24px;
      background: rgba(0,0,0,.82);
      font-size: 18px;
      line-height: 1.45;
      transition: opacity .35s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .status {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 6;
      color: rgba(255,255,255,.95);
      font-size: 13px;
      text-align: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
    }

    .cameraBox {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 110px;
      height: 146px;
      border-radius: 12px;
      overflow: hidden;
      z-index: 7;
      background: #111;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 6px 18px rgba(0,0,0,.35);
    }

    .cameraBox.hidden,
    .cameraLabel.hidden {
      display: none;
    }

    #debugVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
    }

    .cameraLabel {
      position: absolute;
      top: 164px;
      left: 12px;
      z-index: 7;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.55);
      color: #fff;
      font-size: 11px;
    }

    .hardLoading {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: none;
      place-items: center;
      text-align: center;
      padding: 24px;
      color: #fff;
      background: radial-gradient(circle at center, rgba(255,255,255,.06), rgba(0,0,0,.92));
      font-size: 16px;
      line-height: 1.45;
    }

    .hardLoading.show {
      display: grid;
    }

    video#presenceCam,
    canvas#presenceCanvas {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0.001;
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 0; height: 0; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <div id="agent-root">
        <div id="agent-container"></div>
      </div>

      <div class="overlay" id="overlay">
        Avvicinati per iniziare<br>
        L’assistente AI si attiverà automaticamente
      </div>

      <div class="hardLoading" id="hardLoading">
        Attivazione assistente in corso…
      </div>

      <div class="status" id="status">Avvio rilevamento presenza…</div>

      <div class="cameraBox" id="cameraBox">
        <video id="debugVideo" autoplay playsinline muted></video>
      </div>
      <div class="cameraLabel" id="cameraLabel">Camera attiva</div>
    </div>
  </div>

  <video id="presenceCam" autoplay playsinline muted></video>
  <canvas id="presenceCanvas" width="160" height="120"></canvas>

  <script>
    const overlay = document.getElementById('overlay');
    const hardLoading = document.getElementById('hardLoading');
    const statusBox = document.getElementById('status');
    const cam = document.getElementById('presenceCam');
    const debugVideo = document.getElementById('debugVideo');
    const cameraBox = document.getElementById('cameraBox');
    const cameraLabel = document.getElementById('cameraLabel');
    const canvas = document.getElementById('presenceCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const CLIENT_KEY = 'Z29vZ2xlLW9hdXRoMnwxMTgyMzY0ODQ3MTYxODA2NDM0Mjk6SkNJemxyN2FsYmhFR1Q3WmxOMVRy';
    const AGENT_ID = 'v2_agt_TSs3J5qX';

    let stream = null;
    let detected = false;
    let motionInterval = null;
    let lastFrame = null;
    let motionHits = 0;
    let sdkScript = null;
    let rebuildCount = 0;
    let bootStarted = false;
    let watchdog1 = null;
    let watchdog2 = null;

    function setStatus(text) {
      statusBox.textContent = text;
      console.log(text);
    }

    function requestFs() {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (fn) {
        try { fn.call(el); } catch (e) {}
      }
    }

    function cleanupCamera() {
      if (motionInterval) {
        clearInterval(motionInterval);
        motionInterval = null;
      }
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      cam.srcObject = null;
      debugVideo.srcObject = null;
      cameraBox.classList.add('hidden');
      cameraLabel.classList.add('hidden');
    }

    async function startCamera() {
      try {
        setStatus('Richiesta accesso alla fotocamera…');

        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 15, max: 20 }
          },
          audio: false
        });

        cam.srcObject = stream;
        debugVideo.srcObject = stream;

        await waitVideoReady(cam);
        await cam.play().catch(() => {});
        await debugVideo.play().catch(() => {});

        setStatus('Rilevamento presenza attivo');
        startMotionDetection();

      } catch (err) {
        console.error(err);
        setStatus('Fotocamera non disponibile');
      }
    }

    function waitVideoReady(videoEl) {
      return new Promise((resolve) => {
        if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
          resolve();
          return;
        }
        const done = () => {
          if (videoEl.videoWidth > 0 && videoEl.videoHeight > 0) {
            videoEl.removeEventListener('loadedmetadata', done);
            videoEl.removeEventListener('canplay', done);
            resolve();
          }
        };
        videoEl.addEventListener('loadedmetadata', done);
        videoEl.addEventListener('canplay', done);
      });
    }

    function startMotionDetection() {
      lastFrame = null;
      motionHits = 0;

      motionInterval = setInterval(() => {
        if (detected) return;
        if (!cam.videoWidth || cam.readyState < 2) return;

        try {
          ctx.drawImage(cam, 0, 0, canvas.width, canvas.height);
          const frame = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

          if (lastFrame) {
            let changed = 0;
            let sum = 0;

            for (let i = 0; i < frame.length; i += 8) {
              const d = Math.abs(frame[i] - lastFrame[i]);
              sum += d;
              if (d > 12) changed++;
            }

            if (sum > 7000 && changed > 250) {
              motionHits++;
              setStatus('Presenza in rilevamento…');
            } else {
              motionHits = Math.max(0, motionHits - 1);
              setStatus('Attendo presenza…');
            }

            if (motionHits >= 2) {
              onPresenceDetected();
              return;
            }
          }

          lastFrame = new Uint8ClampedArray(frame);
        } catch (e) {
          console.warn('Errore motion detection:', e);
        }
      }, 250);
    }

    function unlockInteraction() {
      try {
        window.focus();

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.style.position = 'fixed';
        btn.style.left = '-9999px';
        btn.style.top = '-9999px';
        btn.style.opacity = '0';
        document.body.appendChild(btn);
        btn.focus();
        btn.click();
        document.body.removeChild(btn);

        document.body.dispatchEvent(new MouseEvent('click', {
          view: window,
          bubbles: true,
          cancelable: true
        }));

        const audio = new Audio();
        audio.muted = true;
        const p = audio.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (e) {
        console.log('unlock interaction error', e);
      }
    }

    function resetAgentContainer() {
      const root = document.getElementById('agent-root');
      root.innerHTML = '<div id="agent-container"></div>';
    }

    function removeSdkScript() {
      if (sdkScript && sdkScript.parentNode) {
        sdkScript.parentNode.removeChild(sdkScript);
      }
      sdkScript = null;
    }

    function loadDidSdkFresh() {
      removeSdkScript();
      resetAgentContainer();

      setStatus(rebuildCount === 0 ? 'Caricamento assistente…' : 'Riavvio assistente…');
      hardLoading.classList.add('show');

      sdkScript = document.createElement('script');
      sdkScript.type = 'module';
      sdkScript.src = 'https://agent.d-id.com/v2/index.js';
      sdkScript.setAttribute('data-mode', 'full');
      sdkScript.setAttribute('data-client-key', CLIENT_KEY);
      sdkScript.setAttribute('data-agent-id', AGENT_ID);
      sdkScript.setAttribute('data-name', 'did-agent');
      sdkScript.setAttribute('data-monitor', 'false');
      sdkScript.setAttribute('data-target-id', 'agent-container');

      sdkScript.onload = () => {
        setStatus('SDK caricato, attendo agente…');
      };

      sdkScript.onerror = () => {
        setStatus('Errore caricamento SDK D-ID');
        hardLoading.classList.remove('show');
      };

      document.body.appendChild(sdkScript);

      clearTimeout(watchdog1);
      clearTimeout(watchdog2);

      watchdog1 = setTimeout(() => {
        const root = document.getElementById('agent-root');
        const hasRenderedSomething = root.querySelector('iframe, video, canvas, [data-name], did-agent');

        if (!hasRenderedSomething && rebuildCount < 1) {
          rebuildCount++;
          setStatus('Tentativo di riavvio assistente…');
          loadDidSdkFresh();
        }
      }, 7000);

      watchdog2 = setTimeout(() => {
        hardLoading.classList.remove('show');
        setStatus('Assistente avviato');
      }, 12000);
    }

    function bootDid() {
      if (bootStarted) return;
      bootStarted = true;

      unlockInteraction();
      requestFs();

      setTimeout(() => {
        loadDidSdkFresh();
      }, 800);
    }

    function onPresenceDetected() {
      if (detected) return;
      detected = true;

      overlay.classList.add('hidden');
      hardLoading.classList.add('show');
      setStatus('Presenza rilevata');

      cleanupCamera();

      setTimeout(() => {
        bootDid();
      }, 1200);
    }

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (event) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) event.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('touchstart', unlockInteraction, { once: true, passive: true });
    document.addEventListener('click', unlockInteraction, { once: true });

    startCamera();
  </script>
</body>
</html>
